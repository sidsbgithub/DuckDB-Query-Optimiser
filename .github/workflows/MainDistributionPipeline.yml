#
# Builds the extension binary the grader benchmarks. Both Linux architectures are
# built because either can be the grading machine; every other target would spend
# your Actions minutes on a binary nobody ever evaluates.
#
# No push ever builds on its own: "Run workflow" starts a build, and it can build
# any branch, but only the default branch is ever graded. Building on every push
# to main is opt-in, via scripts/assignment-setup.py.
#
name: Main Extension Distribution Pipeline
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: waddle
      exclude_archs: 'linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
